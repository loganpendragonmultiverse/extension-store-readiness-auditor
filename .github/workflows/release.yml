name: Release build
on:
  push: { tags: ["v*"] }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - name: Verify tag and checksum distributions
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, tomllib
          root = pathlib.Path('.')
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          version = project['version']
          if os.environ.get('GITHUB_REF_NAME') != 'v' + version:
              raise SystemExit('tag does not match package version')
          stem = project['name'].replace('-', '_') + '-' + version
          expected = {stem + '-py3-none-any.whl', stem + '.tar.gz'}
          files = sorted((root / 'dist').iterdir())
          if {p.name for p in files} != expected:
              raise SystemExit('unexpected distribution set')
          content = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files)
          (root / 'dist' / 'SHA256SUMS').write_text(content, encoding='utf-8', newline='')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: python-distributions, path: "dist/*" }
