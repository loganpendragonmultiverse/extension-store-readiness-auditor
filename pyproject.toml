[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extension-store-readiness-auditor"
version = "1.0.0"
description = "Audit browser-extension packages for cross-store submission risks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
extension-store-audit = "extension_store_readiness_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
omit = ["src/*/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=extension_store_readiness_auditor --cov-branch --cov-report=term-missing --cov-fail-under=90"
